services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: brick_erp
      POSTGRES_USER: brick_erp_app
      POSTGRES_PASSWORD: brick_erp_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - brick_erp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brick_erp_app -d brick_erp"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  brick_erp_pgdata:
